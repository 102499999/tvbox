name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        # The ubuntu runner ships a preinstalled SDK; only licences and the exact
        # versions AGP 9 asks for are missing. AGP can also fetch them itself, so
        # this step is allowed to fail rather than blocking the build.
        continue-on-error: true
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$SM" --licenses > /dev/null 2>&1
          "$SM" --install "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode release keystore
        run: |
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 -d > signing/tvbox-release.jks
          test -s signing/tvbox-release.jks || { echo "::error::keystore secret missing or empty"; exit 1; }
        env:
          KEYSTORE_B64: ${{ secrets.TVBOX_KEYSTORE_B64 }}

      - name: Read version
        id: version
        run: |
          VERSION_NAME=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | grep -oE '"[^"]+"' | tr -d '"')
          VERSION_CODE=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building v$VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --console=plain
        env:
          TVBOX_RELEASE_STORE_FILE: signing/tvbox-release.jks
          TVBOX_RELEASE_STORE_PASSWORD: ${{ secrets.TVBOX_KEYSTORE_PASSWORD }}
          TVBOX_RELEASE_KEY_ALIAS: tvbox
          TVBOX_RELEASE_KEY_PASSWORD: ${{ secrets.TVBOX_KEYSTORE_PASSWORD }}

      - name: Collect APK
        id: apk
        run: |
          VERSION_NAME="${{ steps.version.outputs.name }}"
          mv app/build/outputs/apk/release/app-release.apk "TVBox-v${VERSION_NAME}.apk"
          SHA=$(sha256sum "TVBox-v${VERSION_NAME}.apk" | awk '{print $1}')
          SIZE=$(stat -c%s "TVBox-v${VERSION_NAME}.apk")
          echo "file=TVBox-v${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA size=$SIZE"

      - name: Build OTA manifest
        run: |
          VERSION_NAME="${{ steps.version.outputs.name }}"
          VERSION_CODE="${{ steps.version.outputs.code }}"
          REPO="${{ github.repository }}"
          TAG="v${VERSION_NAME}"
          URL="https://github.com/${REPO}/releases/download/${TAG}/TVBox-v${VERSION_NAME}.apk"
          {
            echo "{"
            echo "  \"versionCode\": ${VERSION_CODE},"
            echo "  \"versionName\": \"${VERSION_NAME}\","
            echo "  \"apkUrl\": \"${URL}\","
            echo "  \"apkSha256\": \"${{ steps.apk.outputs.sha }}\","
            echo "  \"apkSize\": ${{ steps.apk.outputs.size }},"
            echo "  \"force\": false,"
            echo "  \"changelog\": ["
            echo "    \"支持 Android 7.0 (API 24) 及以上设备。\""
            echo "  ]"
            echo "}"
          } > update.json
          cat update.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: TVBox v${{ steps.version.outputs.name }} (Android 7+)
          body: |
            ## TVBox v${{ steps.version.outputs.name }}

            本版本基于上游 v1.3.13，将 `minSdk` 从 28 降到 24，支持 Android 7.0 / 7.1（API 24）电视盒子。

            改动：
            - `minSdk` 28 → 24
            - 补齐 legacy PNG 启动图标（原工程只有 `mipmap-anydpi-v26`，API 24/25 无法匹配）
            - 修复 OTA 下载更新在 API 24/25 上的崩溃（`NotificationChannel` / `Notification.Builder` 需 API 26）
            - 安装未知来源跳转按系统版本选择目标设置页

            APK 校验值：`${{ steps.apk.outputs.sha }}`

            > 签名与上游不同，若已安装过官方版本请先卸载。
          files: |
            TVBox-v${{ steps.version.outputs.name }}.apk
            update.json
          draft: false

      - name: Commit OTA manifest back to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          cp update.json /tmp/update.json
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/update.json update.json
          git add update.json
          if git diff --cached --quiet; then echo "update.json already up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: OTA manifest for v${{ steps.version.outputs.name }}"
          git push origin main
